<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Pharmafind - offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f8f7; color: #12302b; padding: 16px; }
      @media (prefers-color-scheme: dark) { body { background: #0c1816; color: #e6f2ef; } }
      main { max-width: 420px; text-align: center; }
      .mark { width: 64px; height: 64px; border-radius: 16px; background: #0f766e; color: #fff; display: grid; place-items: center; font-size: 36px; font-weight: 800; margin: 0 auto 16px; }
      button { font: inherit; font-weight: 600; padding: 12px 20px; border: 0; border-radius: 10px; background: #0f766e; color: #fff; min-height: 44px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">+</div>
      <h1>You're offline</h1>
      <p>Pharmafind needs a connection to check which pharmacies have your medicine in stock. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
