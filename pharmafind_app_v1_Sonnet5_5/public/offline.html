<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Pharmafind - offline</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #f4f7f7; color: #11212b; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0d1517; color: #e8f0f1; } }
    main { max-width: 420px; text-align: center; }
    .mark { width: 56px; height: 56px; border-radius: 16px; background: #0f766e; color: #fff; display: inline-grid; place-items: center; font-size: 28px; font-weight: 800; }
    button { font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 10px; border: 0; background: #0f766e; color: #fff; min-height: 44px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">+</div>
    <h1>You are offline</h1>
    <p>Pharmafind needs a connection to show live pharmacy stock and prices. Stock data is never saved on your device, so you never see old availability by accident.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
